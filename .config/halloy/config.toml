# Halloy config.
#
# For a complete list of available options,
# please visit https://halloy.squidowl.org/configuration/index.html
theme = "kanagawa"

[servers.libera]
nickname = "kareigu"
username = "kareigu/irc.libera.chat"
server = "conn.karei.dev"
password = ""
channels = ["#halloy", "#neovim", "#zig", "#ghostty"]
dangerously_accept_invalid_certs = true

[sidebar]
position = "top"

[sidebar.unread_indicator]
title = true
icon = "dot"
highlight_icon = "circle-empty"

[actions.sidebar]
buffer = "replace-pane"
focused_buffer = "close-pane"

[buffer.channel.topic]
enabled = true

[buffer.text_input]
auto_format = "markdown"

[buffer.timestamp]
format = "%X"

[font]
family = "TX-02"
size = 16

[buffer.server_messages.join]
smart = 60

[buffer.server_messages.part]
smart = 60

[buffer.server_messages.quit]
smart = 60

[buffer.server_messages.change_host]
smart = 60
