[theme]
theme = "slick"
[theme.overrides]
separator = "native"
alternating_tint_bg = "none"
alternating_tint_fg = "none"
idle_fg = "#DCD7BA"
idle_bg = "#363646"
good_fg = "#DCD7BA"
good_bg = "#76946A"
warning_fg = { link = "good_fg" }
warning_bg = "#FF9E3B"
critical_fg = { link = "good_fg" }
critical_bg = "#E82424"
info_fg = { link = "good_fg" }
info_bg = "#6A9589"


[icons]
icons = "awesome4"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "battery"

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "

[[block]]
block = "custom"
command = "echo \uf011" # assumes fontawesome icons
interval = "once"
[[block.click]]
button = "left"
cmd = "loginctl `echo -e 'suspend\npoweroff\nreboot' | tofi --prompt-text 'power '`"
